<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dibuja sobre los laberintos</title><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#e8edf3;color:#172233}header{position:sticky;top:0;background:#fff;z-index:10;box-shadow:0 2px 10px #0002;padding:10px 12px}.bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}button,select,input[type=color]{border:1px solid #bbc5d0;background:#fff;border-radius:9px;padding:8px;min-height:39px;font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.active{background:#174c9a;color:#fff}label{display:inline-flex;align-items:center;gap:6px;font-size:14px}input[type=range]{width:100px}main{padding:14px 8px 30px}.paper{position:relative;margin:auto;max-width:min(100%,900px);background:white;box-shadow:0 3px 20px #0002;overflow:hidden;touch-action:none}.paper img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.paper canvas,.paper .overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.info{text-align:center;margin:6px auto 14px;font-size:14px;max-width:850px;color:#465569}#notice{font-weight:650;color:#174c9a} @media print{@page{size:auto;margin:5mm}header,.info,.noprint{display:none!important}body,main{background:white;padding:0}.paper{width:100%!important;max-width:none;box-shadow:none;break-inside:avoid}}
</style><style>
/* Interfaz inmersiva: lámina completa, sin desplazamiento */
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh}
main{position:fixed;inset:0;padding:0!important;margin:0!important;display:flex;align-items:center;justify-content:center;overflow:hidden}
.paper{width:min(100vw,calc(100dvh * var(--aspect, .6666667)))!important;max-width:none!important;max-height:100dvh!important;margin:0!important;box-shadow:none!important;flex:0 0 auto}
.paper img{width:100%;height:auto;display:block}
.info,.toast{display:none!important}
header{position:fixed;inset:0;z-index:30;background:transparent;box-shadow:none;padding:0;pointer-events:none}
#menuToggle{position:absolute;top:max(6px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right));width:42px;height:42px;min-height:42px;border:1px solid #9999;border-radius:12px;background:#fffffff0;box-shadow:0 2px 8px #0003;pointer-events:auto;z-index:34;font-size:23px;padding:0}
#menuShade{position:absolute;inset:0;background:#0005;z-index:31;pointer-events:auto}
header .bar{position:absolute;top:calc(max(6px,env(safe-area-inset-top)) + 49px);right:max(6px,env(safe-area-inset-right));left:6px;max-height:calc(100dvh - 65px);overflow-y:auto;z-index:33;padding:12px;background:#fffffff8;box-shadow:0 4px 20px #0004;border-radius:13px;pointer-events:auto;justify-content:flex-start}
header:not(.opened) #menuShade,header:not(.opened) .bar{display:none!important}
header.opened~main .paper canvas,header.opened~main .paper .overlay{pointer-events:none!important}
@media print{html,body{height:auto;overflow:visible}header{display:none!important}main{position:static;display:block;overflow:visible}.paper{width:100%!important;max-height:none!important}.paper img{max-height:none!important}}
</style></head><body><header><div id="menuShade"></div><button type="button" id="menuToggle" aria-label="Abrir controles" aria-expanded="false">☰</button><div class="bar"><strong>✏️ Dibuja en el laberinto</strong><select id="sheet" aria-label="Elegir lámina"></select><label>Color <input id="color" type="color" value="#e52b32"></label><label>Grosor <input id="width" type="range" min="1" max="32" value="5"><output id="widthVal">5</output></label><button id="pen" class="active">Lápiz</button><button id="eraser">Goma</button><button id="undo">↶</button><button id="redo">↷</button><button id="clear">Limpiar</button><button id="save">Guardar PNG</button><button id="print">Imprimir</button></div></header><main><p class="info">Dibuja con el dedo, ratón o lápiz táctil. Cambia de lámina sin perder lo dibujado. La goma solo borra tus anotaciones, no el dibujo original.</p><div class="paper" id="paper"><img id="base" alt="Laberinto"><canvas id="ink"></canvas></div></main><script>
