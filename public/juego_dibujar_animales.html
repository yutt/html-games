<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Dibuja animales a mano con pistas visuales opcionales.">
<title>Juego de dibujar animales</title>
<style>
:root{--ink:#172033;--muted:#657089;--paper:#fff;--bg:#eef4ff;--primary:#3066e8;--primary2:#224fbd;--danger:#b84034;--line:#c9d4e8}*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}.hidden{display:none!important}.screen{min-height:100vh;padding:clamp(16px,4vw,40px);display:grid;place-items:center}.card{width:min(820px,100%);padding:clamp(20px,5vw,42px);border-radius:24px;background:#fff;box-shadow:0 18px 60px #36518b22}h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.2rem)}.lead{margin:0 0 26px;color:var(--muted)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px;font-weight:750}.field small{font-weight:400;color:var(--muted)}input{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px}input:focus,button:focus-visible{outline:3px solid #85a8ff;outline-offset:2px}.primary,.secondary,.danger,.hint-btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.secondary{background:#e6edfb;color:var(--ink)}.danger{background:#fee9e6;color:var(--danger)}#startBtn{width:100%;margin-top:22px}.error{min-height:1.4em;color:var(--danger);font-weight:700}
.game-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{font-weight:750;color:var(--muted)}.timer{font-variant-numeric:tabular-nums;background:#eef3ff;border-radius:99px;padding:8px 14px;font-size:1.15rem;font-weight:900}.timer.low{background:#fee9e6;color:var(--danger)}.prompt{text-align:center;margin:10px 0 14px}.prompt small{display:block;color:var(--muted);font-weight:700}.animal-name{font-size:clamp(2.4rem,9vw,4.5rem);font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.draw-wrap{position:relative;height:min(48vh,390px);min-height:290px;border:3px dashed #9fb2d5;border-radius:18px;overflow:hidden;background:#fff;touch-action:none}.draw-wrap canvas{position:absolute;z-index:2;inset:0;width:100%;height:100%;display:block;touch-action:none}.hint-image{position:absolute;z-index:1;left:50%;top:50%;width:56%;height:72%;object-fit:contain;transform:translate(-50%,-50%) scale(1.35);image-rendering:pixelated;filter:blur(5px) grayscale(.25);opacity:0;transition:opacity .2s;pointer-events:none}.draw-wrap.show-hint .hint-image{opacity:.18}.hint-btn{position:absolute;z-index:3;right:10px;top:10px;padding:8px 12px;background:#f0f3f8dd;color:#5d687a;font-size:.86rem;box-shadow:0 2px 8px #35435c18}.hint-btn.active{background:#dfe8ff;color:#244aab}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:14px}.controls>div{display:flex;gap:10px}
#resultScreen{min-height:100vh;padding:24px}.sheet{width:min(210mm,100%);min-height:297mm;margin:auto;padding:12mm;background:#fff;box-shadow:0 8px 35px #24375a26}.sheet-title{text-align:center;margin:0;font-size:2rem}.sheet-meta{margin:14px 0 18px}.name-area{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:10px;font-weight:800}.name-area>span{padding-top:30px}.name-field{display:grid;justify-items:end;gap:5px}.name-box{position:relative;width:100%;height:92px;border:1.5px solid #c9ced8;border-radius:9px;background:#fafbfc;overflow:hidden}.name-box:after{content:"";position:absolute;z-index:0;left:0;right:0;top:50%;border-top:1px dashed #cbd0d9;pointer-events:none}.name-canvas{position:relative;z-index:1;width:100%;height:100%;background:transparent}.name-clear{border:0;background:transparent;color:#788292;padding:3px 8px;border-radius:8px;font-size:.78rem;font-weight:650;cursor:pointer}.name-clear:hover{background:#eef1f5}.summary{text-align:right;margin-top:4px}.summary strong{display:block}.drawings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.drawing{border:1px solid #cbd3df;border-radius:12px;padding:8px;break-inside:avoid}.drawing h2{text-align:center;margin:0 0 4px;font-size:1.05rem}.drawing img{display:block;width:100%;height:145px;object-fit:contain;background:#fff}.blank{display:grid;place-items:center;height:145px;color:#9aa3b2;font-style:italic}.result-actions{display:flex;justify-content:center;gap:12px;margin:22px}.print-note{text-align:center;color:var(--muted);font-size:.9rem}
@media(max-width:620px){.settings{grid-template-columns:1fr}.controls{flex-direction:column}.controls>div{justify-content:space-between}.controls>.primary{width:100%}.sheet{padding:7mm}.drawings{grid-template-columns:1fr}.summary{text-align:left}}
@page{size:A4;margin:8mm}@media print{body{background:#fff}#setupScreen,#gameScreen,.result-actions,.print-note,.name-clear{display:none!important}#resultScreen{padding:0}.sheet{width:100%;min-height:auto;padding:0;box-shadow:none}.name-field{gap:0}.drawings{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.drawing img,.blank{height:125px}}
</style>
</head>
<body>
<section id="setupScreen" class="screen"><main class="card"><h1>¡Dibuja animales!</h1><p class="lead">Dibuja cada animal con el dedo o un lápiz digital. Si lo necesitas, puedes pedir una pista.</p><div class="settings"><label class="field">Número de animales<input id="countInput" type="number" min="1" max="30" value="6" inputmode="numeric"><small>Entre 1 y 30, sin repetir</small></label><label class="field">Tiempo (minutos)<input id="minutesInput" type="number" min="1" max="60" value="10" inputmode="numeric"><small>Entre 1 y 60</small></label></div><button id="startBtn" class="primary">Empezar</button><p id="setupError" class="error" role="alert"></p></main></section>
<section id="gameScreen" class="screen hidden"><main class="card"><header class="game-head"><span id="progress" class="progress"></span><span id="timer" class="timer">00:00</span></header><div class="prompt"><small>Dibuja un…</small><div id="animalName" class="animal-name"></div></div><div id="drawWrap" class="draw-wrap"><img id="hintImage" class="hint-image" alt="Pista visual"><canvas id="drawCanvas" aria-label="Zona para dibujar el animal"></canvas><button id="hintBtn" class="hint-btn" type="button">Ver pista</button></div><div class="controls"><div><button id="undoBtn" class="secondary">Deshacer</button><button id="clearBtn" class="danger">Borrar</button></div><button id="nextBtn" class="primary">Siguiente →</button></div></main></section>
<section id="resultScreen" class="hidden"><article class="sheet"><h1 class="sheet-title">Mis animales</h1><div class="sheet-meta"><div class="name-area"><span>Nombre:</span><div class="name-field"><div class="name-box"><canvas id="nameCanvas" class="name-canvas" aria-label="Zona para escribir el nombre"></canvas></div><button id="clearNameBtn" class="name-clear" type="button">Borrar nombre</button></div></div><div class="summary"><strong id="finalTime"></strong><span id="finalInfo"></span></div></div><div id="drawings" class="drawings"></div><p class="print-note">Las pistas no forman parte de los dibujos y no aparecerán en la ficha.</p></article><div class="result-actions"><button id="restartBtn" class="secondary">Nueva partida</button><button id="printBtn" class="primary">Imprimir ficha</button></div></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const ANIMALS=[
['perro','🐕'],['gato','🐈'],['ratón','🐁'],['hámster','🐹'],['conejo','🐇'],['zorro','🦊'],['lobo','🐺'],['oso','🐻'],['oso polar','🐻‍❄️'],['panda','🐼'],['koala','🐨'],['tigre','🐅'],['león','🦁'],['leopardo','🐆'],['caballo','🐎'],['unicornio','🦄'],['cebra','🦓'],['ciervo','🦌'],['vaca','🐄'],['toro','🐂'],['búfalo','🐃'],['bisonte','🦬'],['cerdo','🐖'],['jabalí','🐗'],['oveja','🐑'],['cabra','🐐'],['camello','🐫'],['dromedario','🐪'],['llama','🦙'],['jirafa','🦒'],['elefante','🐘'],['rinoceronte','🦏'],['hipopótamo','🦛'],['mono','🐒'],['gorila','🦍'],['orangután','🦧'],['perezoso','🦥'],['canguro','🦘'],['tejón','🦡'],['castor','🦫'],['erizo','🦔'],['murciélago','🦇'],['ardilla','🐿️'],['nutria','🦦'],['mofeta','🦨'],['águila','🦅'],['búho','🦉'],['loro','🦜'],['flamenco','🦩'],['pavo real','🦚'],['pingüino','🐧'],['pato','🦆'],['cisne','🦢'],['ganso','🪿'],['gallina','🐔'],['gallo','🐓'],['pavo','🦃'],['paloma','🕊️'],['cuervo','🐦‍⬛'],['rana','🐸'],['cocodrilo','🐊'],['tortuga','🐢'],['lagarto','🦎'],['serpiente','🐍'],['dragón de Komodo','🦎'],['ballena','🐋'],['delfín','🐬'],['foca','🦭'],['tiburón','🦈'],['pulpo','🐙'],['calamar','🦑'],['cangrejo','🦀'],['langosta','🦞'],['gamba','🦐'],['pez','🐟'],['pez globo','🐡'],['caballito de mar','🦐'],['medusa','🪼'],['caracol','🐌'],['mariposa','🦋'],['abeja','🐝'],['mariquita','🐞'],['hormiga','🐜'],['escarabajo','🪲'],['grillo','🦗'],['mosquito','🦟'],['mosca','🪰'],['gusano','🪱'],['araña','🕷️'],['escorpión','🦂'],['dinosaurio','🦕'],['tiranosaurio','🦖']
].map(([name,icon])=>({name,icon}));
const setup=$('setupScreen'),game=$('gameScreen'),result=$('resultScreen');let selected=[],drawings=[],index=0,startedAt=0,limitSeconds=0,ticker=null,finished=false;
function visible(el){[setup,game,result].forEach(x=>x.classList.add('hidden'));el.classList.remove('hidden')}
function formatTime(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function iconImage(icon){const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.textAlign='center';x.textBaseline='middle';x.font='38px sans-serif';x.fillText(icon,24,26);return c.toDataURL('image/png')}
function drawingPad(canvas,lineWidth=5){const ctx=canvas.getContext('2d'),strokes=[];let active=null;function size(){const r=canvas.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1),old=canvas.width?canvas.toDataURL():null;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14213d';ctx.lineWidth=lineWidth;if(old){const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function redraw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);for(const s of strokes){if(!s.length)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);if(s.length===1)ctx.lineTo(s[0].x+.1,s[0].y+.1);else s.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);active=[point(e)];strokes.push(active);redraw()});canvas.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();active.push(point(e));redraw()});['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>active=null));size();addEventListener('resize',size);return{resize:size,clear(){strokes.length=0;redraw()},undo(){strokes.pop();redraw()},isEmpty(){return !strokes.length},image(){return canvas.toDataURL('image/png')}}}
const drawPad=drawingPad($('drawCanvas')),namePad=drawingPad($('nameCanvas'),2.25);
function showAnimal(){const a=selected[index];$('progress').textContent=`Animal ${index+1} de ${selected.length}`;$('animalName').textContent=a.name;$('hintImage').src=iconImage(a.icon);$('drawWrap').classList.remove('show-hint');$('hintBtn').classList.remove('active');$('hintBtn').textContent='Ver pista';$('nextBtn').textContent=index===selected.length-1?'Terminar':'Siguiente →';drawPad.clear()}
function elapsed(){return Math.min(limitSeconds,Math.max(0,(Date.now()-startedAt)/1000))}function updateTimer(){const left=Math.max(0,limitSeconds-elapsed());$('timer').textContent=formatTime(Math.ceil(left));$('timer').classList.toggle('low',left<=30);if(left<=0)finish(true)}function storeCurrent(){drawings[index]=drawPad.isEmpty()?null:drawPad.image()}
function finish(timedOut=false){if(finished)return;finished=true;clearInterval(ticker);if(index<selected.length)storeCurrent();const box=$('drawings');box.replaceChildren();selected.forEach((a,i)=>{const card=document.createElement('section');card.className='drawing';const title=document.createElement('h2');title.textContent=`${i+1}. ${a.name}`;card.append(title);if(drawings[i]){const img=document.createElement('img');img.src=drawings[i];img.alt=`Dibujo de ${a.name}`;card.append(img)}else{const blank=document.createElement('div');blank.className='blank';blank.textContent='Sin dibujo';card.append(blank)}box.append(card)});$('finalTime').textContent=`Tiempo: ${formatTime(elapsed())}`;$('finalInfo').textContent=timedOut?'Tiempo agotado':`${selected.length} animales`;visible(result);requestAnimationFrame(()=>{namePad.resize();namePad.clear()})}
$('startBtn').addEventListener('click',()=>{const count=Number($('countInput').value),minutes=Number($('minutesInput').value);if(!Number.isInteger(count)||count<1||count>30||!Number.isFinite(minutes)||minutes<1||minutes>60){$('setupError').textContent='Usa entre 1 y 30 animales y entre 1 y 60 minutos.';return}$('setupError').textContent='';selected=shuffle([...ANIMALS]).slice(0,count);drawings=[];index=0;limitSeconds=minutes*60;startedAt=Date.now();finished=false;visible(game);drawPad.resize();showAnimal();updateTimer();ticker=setInterval(updateTimer,250)});
$('hintBtn').addEventListener('click',()=>{const on=$('drawWrap').classList.toggle('show-hint');$('hintBtn').classList.toggle('active',on);$('hintBtn').textContent=on?'Ocultar pista':'Ver pista'});$('nextBtn').addEventListener('click',()=>{storeCurrent();if(index===selected.length-1)finish(false);else{index++;showAnimal()}});$('clearBtn').addEventListener('click',()=>drawPad.clear());$('undoBtn').addEventListener('click',()=>drawPad.undo());$('clearNameBtn').addEventListener('click',()=>namePad.clear());$('printBtn').addEventListener('click',()=>window.print());$('restartBtn').addEventListener('click',()=>{clearInterval(ticker);visible(setup)});
})();
</script>
</body></html>
