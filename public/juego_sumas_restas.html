<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Practica sumas y restas escribiendo las respuestas a mano.">
  <title>Juego de sumas y restas</title>
  <style>
    :root{--ink:#172033;--muted:#657089;--paper:#fff;--bg:#eef4ff;--primary:#3066e8;--primary2:#224fbd;--danger:#c0392b;--line:#c9d4e8}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
    button,input,select{font:inherit}.screen{min-height:100vh;padding:clamp(18px,4vw,42px);display:grid;place-items:center}.hidden{display:none!important}
    .card{width:min(720px,100%);background:var(--paper);border-radius:24px;padding:clamp(22px,5vw,46px);box-shadow:0 18px 60px #36518b22}
    h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.3rem)}.lead{margin:0 0 28px;color:var(--muted)}
    .settings{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.field{display:grid;gap:7px;font-weight:700}.field small{font-weight:400;color:var(--muted)}
    input,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
    input:focus,select:focus,button:focus-visible{outline:3px solid #85a8ff;outline-offset:2px}
    .primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.secondary{background:#e6edfb;color:var(--ink)}.danger{background:#fee9e6;color:var(--danger)}
    #startBtn{width:100%;margin-top:24px;font-size:1.1rem}.error{min-height:1.4em;margin:10px 0 0;color:var(--danger);font-weight:700}
    .game-card{width:min(820px,100%)}.game-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.progress{font-weight:750;color:var(--muted)}
    .timer{font-variant-numeric:tabular-nums;background:#eef3ff;border-radius:99px;padding:8px 14px;font-size:1.15rem;font-weight:900}.timer.low{background:#fee9e6;color:var(--danger)}
    .operation{text-align:center;font-size:clamp(3.5rem,14vw,7rem);font-weight:900;letter-spacing:.04em;margin:12px 0}
    .canvas-wrap{position:relative;border:3px dashed #9fb2d5;border-radius:18px;overflow:hidden;background:#fff;touch-action:none}.canvas-label{position:absolute;top:10px;left:14px;color:#9aa5ba;font-weight:700;pointer-events:none}
    canvas{display:block;width:100%;height:250px;touch-action:none}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.controls>div{display:flex;gap:10px}
    #resultScreen{display:block;min-height:100vh;padding:24px}.sheet{width:min(210mm,100%);min-height:297mm;margin:auto;background:#fff;padding:12mm;box-shadow:0 8px 35px #24375a26}
    .sheet-title{text-align:center;margin:0;font-size:2rem}.sheet-meta{display:block;margin:14px 0 18px}.name-area{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:10px;width:100%;font-weight:800}.name-area>span{padding-top:30px}.name-field{display:grid;justify-items:end;gap:5px}.name-box{position:relative;width:100%;height:92px;border:1.5px solid #c9ced8;border-radius:9px;background:#fafbfc;overflow:hidden}.name-box::after{content:"";position:absolute;z-index:0;left:0;right:0;top:50%;border-top:1px dashed #cbd0d9;pointer-events:none}.name-canvas{position:relative;z-index:1;width:100%;height:100%;border:0;background:transparent}.name-clear{border:0;background:transparent;color:#788292;padding:3px 8px;border-radius:8px;font-size:.78rem;font-weight:650;cursor:pointer}.name-clear:hover{background:#eef1f5;color:#465064}.summary{text-align:right;margin-top:4px}.summary strong{display:block;font-size:1.15rem}
    .answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}.answer{display:grid;grid-template-columns:auto 1fr;align-items:center;min-height:72px;border-bottom:1px solid #aeb8c9;padding:5px}.answer-op{font-size:1.55rem;font-weight:850;white-space:nowrap}.answer img{width:100%;height:62px;object-fit:contain;object-position:left center}.blank{color:#a0a8b8;font-style:italic;padding-left:12px}
    .result-actions{display:flex;justify-content:center;gap:12px;margin:22px auto}.print-note{text-align:center;color:var(--muted);font-size:.9rem}
    @media(max-width:620px){.settings{grid-template-columns:1fr}.controls{flex-direction:column}.controls>div{justify-content:space-between}.controls .primary{width:100%}.sheet{padding:7mm}.sheet-meta{grid-template-columns:1fr}.summary{text-align:left}.answers{grid-template-columns:1fr}}
    @page{size:A4;margin:8mm}@media print{body{background:#fff}#setupScreen,#gameScreen,.result-actions,.print-note,.name-clear{display:none!important}#resultScreen{padding:0}.sheet{width:100%;min-height:auto;padding:0;box-shadow:none}.name-field{gap:0}.answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}.answer{break-inside:avoid}.sheet-title{font-size:1.6rem}}
  </style>
</head>
<body>
  <section id="setupScreen" class="screen">
    <main class="card">
      <h1>¡A calcular!</h1><p class="lead">Configura la partida y escribe las respuestas con el dedo o un lápiz digital.</p>
      <div class="settings">
        <label class="field">Operaciones<input id="countInput" type="number" min="1" max="50" value="10" inputmode="numeric"><small>Entre 1 y 50</small></label>
        <label class="field">Tipo<select id="typeInput"><option value="add">Sumas</option><option value="sub">Restas</option></select><small>Una modalidad</small></label>
        <label class="field">Tiempo (minutos)<input id="minutesInput" type="number" min="1" max="60" value="5" inputmode="numeric"><small>Entre 1 y 60</small></label>
      </div>
      <button id="startBtn" class="primary">Empezar</button><p id="setupError" class="error" role="alert"></p>
    </main>
  </section>

  <section id="gameScreen" class="screen hidden">
    <main class="card game-card">
      <header class="game-head"><span id="progress" class="progress"></span><span id="timer" class="timer">00:00</span></header>
      <div id="operation" class="operation"></div>
      <div class="canvas-wrap"><span class="canvas-label">Escribe aquí la respuesta</span><canvas id="answerCanvas" aria-label="Zona para escribir la respuesta"></canvas></div>
      <div class="controls"><div><button id="undoBtn" class="secondary">Deshacer</button><button id="clearBtn" class="danger">Borrar</button></div><button id="nextBtn" class="primary">Siguiente →</button></div>
    </main>
  </section>

  <section id="resultScreen" class="hidden">
    <article class="sheet">
      <h1 class="sheet-title">Ficha de cálculo</h1>
      <div class="sheet-meta">
        <div class="name-area"><span>Nombre:</span><div class="name-field"><div class="name-box"><canvas id="nameCanvas" class="name-canvas" aria-label="Zona para escribir el nombre"></canvas></div><button id="clearNameBtn" class="name-clear" type="button">Borrar nombre</button></div></div>
        <div class="summary"><strong id="finalTime"></strong><span id="finalInfo"></span></div>
      </div>
      <div id="answers" class="answers"></div>
      <p class="print-note">Escribe el nombre antes de imprimir: también se conservará en la impresión.</p>
    </article>
    <div class="result-actions"><button id="restartBtn" class="secondary">Nueva partida</button><button id="printBtn" class="primary">Imprimir ficha</button></div>
  </section>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const setup = $('setupScreen'), game = $('gameScreen'), result = $('resultScreen');
    let problems = [], index = 0, answers = [], startedAt = 0, limitSeconds = 0, ticker = null, finished = false;

    function randomInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
    function makeProblem(type){
      if(type === 'add'){
        const total=randomInt(1,20), a=randomInt(0,total); return {a,b:total-a,sign:'+'};
      }
      const a=randomInt(1,9), b=randomInt(0,a-1); return {a,b,sign:'−'};
    }
    function visible(el){ setup.classList.add('hidden'); game.classList.add('hidden'); result.classList.add('hidden'); el.classList.remove('hidden'); }
    function formatTime(seconds){ seconds=Math.max(0,Math.floor(seconds)); return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }

    function drawingPad(canvas, onChange, lineWidth=5){
      const ctx=canvas.getContext('2d'), strokes=[]; let active=null;
      function size(){
        const rect=canvas.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1), snapshot=canvas.width?canvas.toDataURL():null;
        canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14213d';ctx.lineWidth=lineWidth;
        if(snapshot){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=snapshot;}
      }
      function point(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
      function redraw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);for(const s of strokes){if(!s.length)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);if(s.length===1)ctx.lineTo(s[0].x+.1,s[0].y+.1);else s.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}onChange?.();}
      canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);active=[point(e)];strokes.push(active);redraw();});
      canvas.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();active.push(point(e));redraw();});
      const stop=()=>{active=null;};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
      size(); window.addEventListener('resize',size);
      return {resize:size,clear(){strokes.length=0;redraw();},undo(){strokes.pop();redraw();},isEmpty(){return strokes.length===0;},image(){return canvas.toDataURL('image/png');}};
    }

    const answerPad=drawingPad($('answerCanvas'));
    const namePad=drawingPad($('nameCanvas'),null,2.25);

    function showProblem(){
      const p=problems[index]; $('progress').textContent=`Operación ${index+1} de ${problems.length}`; $('operation').textContent=`${p.a} ${p.sign} ${p.b} =`;
      $('nextBtn').textContent=index===problems.length-1?'Terminar':'Siguiente →'; answerPad.clear();
    }
    function elapsed(){return Math.min(limitSeconds,Math.max(0,(Date.now()-startedAt)/1000));}
    function updateTimer(){const left=Math.max(0,limitSeconds-elapsed());$('timer').textContent=formatTime(Math.ceil(left));$('timer').classList.toggle('low',left<=30);if(left<=0)finish(true);}
    function storeCurrent(){answers[index]=answerPad.isEmpty()?null:answerPad.image();}

    function finish(timedOut=false){
      if(finished)return; finished=true; clearInterval(ticker); if(index<problems.length)storeCurrent();
      const used=elapsed(), box=$('answers'); box.replaceChildren();
      problems.forEach((p,i)=>{const row=document.createElement('div');row.className='answer';const op=document.createElement('span');op.className='answer-op';op.textContent=`${i+1}.  ${p.a} ${p.sign} ${p.b} =`;row.append(op);if(answers[i]){const img=document.createElement('img');img.src=answers[i];img.alt=`Respuesta manuscrita de la operación ${i+1}`;row.append(img);}else{const blank=document.createElement('span');blank.className='blank';blank.textContent='Sin respuesta';row.append(blank);}box.append(row);});
      $('finalTime').textContent=`Tiempo: ${formatTime(used)}`;$('finalInfo').textContent=timedOut?'Tiempo agotado':`${problems.length} operaciones`;
      visible(result); requestAnimationFrame(()=>{namePad.resize();namePad.clear();});
    }

    $('startBtn').addEventListener('click',()=>{
      const count=Number($('countInput').value), minutes=Number($('minutesInput').value), type=$('typeInput').value;
      if(!Number.isInteger(count)||count<1||count>50||!Number.isFinite(minutes)||minutes<1||minutes>60){$('setupError').textContent='Revisa los valores: 1–50 operaciones y 1–60 minutos.';return;}
      $('setupError').textContent='';problems=Array.from({length:count},()=>makeProblem(type));index=0;answers=[];limitSeconds=minutes*60;startedAt=Date.now();finished=false;visible(game);answerPad.resize();showProblem();updateTimer();ticker=setInterval(updateTimer,250);
    });
    $('nextBtn').addEventListener('click',()=>{storeCurrent();if(index>=problems.length-1)finish(false);else{index++;showProblem();}});
    $('clearBtn').addEventListener('click',()=>answerPad.clear());$('undoBtn').addEventListener('click',()=>answerPad.undo());
    $('clearNameBtn').addEventListener('click',()=>namePad.clear());
    $('printBtn').addEventListener('click',()=>window.print());
    $('restartBtn').addEventListener('click',()=>{clearInterval(ticker);visible(setup);});
  })();
  </script>
</body>
</html>
